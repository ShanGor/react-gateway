spring:
  application:
    name: react-gateway
  webflux:
    multipart:
      max-parts: 1
      max-disk-usage-per-part: 10MB
      max-in-memory-size: 10MB
      max-headers-size: 2MB
  codec:
    max-in-memory-size: 10MB
  autoconfigure:
    exclude: org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:15432/r1?reWriteBatchedInserts=true&stringtype=unspecified
    username: rag
    password: rag
    name: rag
    hikari:
      auto-commit: true
      connection-timeout: 3000
      idle-timeout: 600000
      connection-test-query: select 1
      minimum-idle: 1
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    url: ${spring.datasource.url}
    user: rag
    password: rag
    change-log: classpath:db/changelog/master.yaml
    enabled: false
  ai:
    ollama:
      chat:
        model: qwen2.5:7b # llama3.2-vision
      base-url: http://localhost:11434
      embedding:
        model: bge-m3
        options:
          max-tokens: 8192
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch

server:
  compression:
    enabled: true

gateway:
  static-file-path: ${STATIC_FILE_PATH}
  default-file: index.html
  spa-path: /ui

ai:
  ollama:
    url: http://localhost:11434

custom:
  ai:
    response-timeout: 2m
  upload-dir: c:/tmp/rag/upload
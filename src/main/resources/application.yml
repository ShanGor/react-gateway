spring:
  application:
    name: ai-chat-backend
  webflux:
    multipart:
      max-parts: 1
      max-disk-usage-per-part: 10MB
      max-in-memory-size: 10MB
      max-headers-size: 2MB
#  autoconfigure:
#    exclude: org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:15432/r1?reWriteBatchedInserts=true&stringtype=unspecified
    username: rag
    password: rag
    name: rag
    hikari:
      auto-commit: true
      connection-timeout: 3000
      idle-timeout: 600000
      connection-test-query: select 1
      minimum-idle: 1
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    url: ${spring.datasource.url}
    user: rag
    password: rag
    change-log: classpath:db/changelog/master.yaml
    enabled: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
            model: qwen3:4b # llama3.2-vision
      base-url: ${OPENAI_HOST}
      embedding:
        options:
          model: bge-m3
          dimensions: 8192
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
  http:
    codecs:
      max-in-memory-size: 10MB

server:
  compression:
    enabled: true

gateway:
  static-file-path: ${STATIC_FILE_PATH}
  default-file: index.html
  spa-path: /ui

cors:
  allowed-origin: http://localhost:5173

custom:
  ai:
    response-timeout: 2m
  upload-dir: c:/tmp/rag/upload
